<!-- CLAUDE javascript starts -->
<script>
const input = document.getElementById('tmessage');
input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;           // ignore every other key
    e.preventDefault();                      // stops any form submit or page reload

    if (!input.value.trim()) return;         // do nothing if the box is empty
    if (input.classList.contains('fading')) return;   // ignore Enter mid-animation

    input.classList.add('fading');           // starts the swipe

    setTimeout(() => {
        input.classList.add('reset');        // turn off the transition...
        input.value = '';                    // ...clear the text...
        input.classList.remove('fading');    // ...and snap back in place
        void input.offsetWidth;              // forces the browser to apply it
        input.classList.remove('reset');     // re-enable the transition
    }, 800);                                 // match the 0.8s in your CSS
});
</script>
