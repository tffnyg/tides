<!-- CLAUDE javascript starts -->
<script>

  // sound button
const ambient = document.getElementById('ambient');
const soundBtn = document.getElementById('sound');

soundBtn.addEventListener('click', () => {
    if (ambient.paused) {
        ambient.play();
        soundBtn.textContent = 'sound off';
    } else {
        ambient.pause();
        soundBtn.textContent = 'sound';
    }
});

// input box
const input = document.getElementById('tmessage');

input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();

    if (!input.value.trim()) return;                  // ignore an empty box
    if (input.classList.contains('pulsing')) return;  // ignore Enter mid-pulse

    input.classList.add('pulsing');                   // starts the pulse
});

// when the animation finishes, clear the text and reset
input.addEventListener('animationend', () => {
    input.value = '';
    input.classList.remove('pulsing');
});

</script>
